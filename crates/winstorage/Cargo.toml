[package]
name = "winstorage"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = "2"
diskcore = { path = "../diskcore" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
]

[dev-dependencies]
tempfile = "3"
regex = "1"
