[package]
name = "rescue"
version.workspace = true
edition.workspace = true

[dependencies]
diskcore = { path = "../../crates/diskcore" }
winstorage = { path = "../../crates/winstorage" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1"

[dev-dependencies]
diskcore = { path = "../../crates/diskcore", features = ["fixtures"] }

[[bin]]
name = "rescue"
path = "src/main.rs"
